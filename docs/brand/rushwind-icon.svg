<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RushWind">
  <defs>
    <linearGradient id="rw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233F"/>
      <stop offset="1" stop-color="#0A0F1E"/>
    </linearGradient>
    <linearGradient id="rw-wind" gradientUnits="userSpaceOnUse" x1="96" y1="410" x2="470" y2="110">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#rw-bg)"/>
  <rect x="7" y="7" width="498" height="498" rx="105" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="14"/>

  <g transform="translate(-24,-6)" stroke="url(#rw-wind)" fill="none" stroke-linecap="round">
    <!-- intake streaks -->
    <path d="M 100 212 H 136" stroke-width="14"/>
    <path d="M 92 260 H 128" stroke-width="14"/>
    <!-- stem -->
    <path d="M 176 172 V 356" stroke-width="48"/>
    <!-- bowl -->
    <path d="M 176 172 H 256 A 56 56 0 0 1 256 284 H 176" stroke-width="48"/>
    <!-- leg: descends, then flicks into wind -->
    <path d="M 190 265 C 300 346 368 360 446 322 C 402 360 296 378 162 303 Z" fill="url(#rw-wind)" stroke="none"/>
    <!-- trail -->
    <path d="M 456 330 L 476 324" stroke-width="8"/>
  </g>
</svg>
