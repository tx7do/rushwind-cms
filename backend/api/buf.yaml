# buf 工作区（本地、无 BSR 依赖）——把同步/vendoring 模型显式化给 buf CLI：
#
#   cd backend/api
#   buf lint                              # 样式报告（仅契约树；快照禁手改，
#                                         #   发现的问题在契约源头修复后再同步）
#   buf build -o /tmp/api-image.binpb     # 编译全工作区（含注解闭包，选项字节保真）
#   buf breaking --against "../../.git#branch=main,subdir=backend/api"
#                                         # 接受新契约 vintage 前的演进检查
#
# 契约树为字节同步快照（api/sync-protos.sh + api/MANIFEST.sha256 门），第三方
# 注解为本地 vendoring（third_party/PROVENANCE.md）。因此这里【不做】buf format
# （会砸字节清单门）、【不挂】BSR deps（本地直接把 vendored 子树声明为 workspace
# 模块，import 跨模块自动解析）。
version: v2

modules:
  # 契约树：字节同步快照（api/MANIFEST.sha256 门）。
  - path: protos
    lint:
      use:
        - STANDARD
  # 手工 vendored 的第三方注解声明（见 third_party/PROVENANCE.md）。整个子树
  # 声明为一个模块：契约里的 import 全部以 third_party/ 为根
  # （google/api/...、gnostic/...、pagination/...），与 build.rs 的
  # `-I third_party` 同构；google/protobuf 由 buf 内置 WKT 解析。
  - path: third_party

breaking:
  use:
    - FILE
