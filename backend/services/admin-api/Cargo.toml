[package]
name = "admin-api"
description = "The admin BFF service of the CMS: config, state, the token store, and the REST (:6600) + SSE (:6601) transports over the shared proto and auth crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
proto = { path = "../../crates/proto" }
store = { path = "../../crates/store" }
auth = { path = "../../crates/auth" }
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel", "router", "transport"] }
tonic-prost = "0.14"
rushwind-authn = { git = "https://github.com/tx7do/rushwind", rev = "2bc3a96c742539a195b608b995be1c3bcc1545a3" }
rushwind-authn-jwt = { git = "https://github.com/tx7do/rushwind", rev = "2bc3a96c742539a195b608b995be1c3bcc1545a3" }
rushwind-bootstrap = { git = "https://github.com/tx7do/rushwind", rev = "2bc3a96c742539a195b608b995be1c3bcc1545a3" }
rushwind-http-binding = { git = "https://github.com/tx7do/rushwind", rev = "2bc3a96c742539a195b608b995be1c3bcc1545a3" }
rushwind-transport = { git = "https://github.com/tx7do/rushwind", rev = "2bc3a96c742539a195b608b995be1c3bcc1545a3" }
rushwind-transport-axum = { git = "https://github.com/tx7do/rushwind", rev = "2bc3a96c742539a195b608b995be1c3bcc1545a3" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "matched-path", "multipart"] }
tokio = { workspace = true }
redis = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures-util = "0.3"
pbjson-types = { workspace = true }
async-trait = { workspace = true }
bcrypt = "0.15"
aes = "0.8"
cbc = "0.1"
base64 = "0.22"
rand = "0.9"
hex = "0.4"
captcha = "0.0.9"
serde_urlencoded = "0.7"
