# The app (C-side) BFF server assembly document: one lifecycle, two
# transports. The http server carries the app route surface behind its
# edge (the CORS policy and the request budget); the SSE notification
# server is a factory transport. Origins mirror the reference app
# server.yaml.
app:
  name: app-api
  version: 0.1.0
servers:
  - kind: http
    bind: ":6700"
    edge:
      timeout: 10s
      cors:
        credentials: true
        compat: true
        headers:
          - "X-Requested-With"
          - "X-Request-ID"
          - "Content-Type"
          - "Authorization"
        methods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "HEAD"
          - "OPTIONS"
        origins:
          # 本地开发端口（vue :5001 / react :5011 / taro :5021）
          - "http://localhost:5001"
          - "http://localhost:5011"
          - "http://localhost:5021"
          - "http://localhost:10086"
          - "https://api.cms.gowind.cloud"
    route_packs:
      - name: app-surface
  - kind: app-sse
    addr: ":6701"
    path: "/events"
