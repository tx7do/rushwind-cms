[package]
name = "auth"
description = "The auth gate for the protected subtrees of both CMS deployments: credential verification, the server-side session checks, and the claim-bag injection, rendering the four-field status envelope on failure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
proto = { path = "../proto" }
async-trait = { workspace = true }
rushwind-authn = { git = "https://github.com/tx7do/rushwind", rev = "eaa813e1c26819251060a0ac7af0b75fe871bcea" }
rushwind-authn-gate = { git = "https://github.com/tx7do/rushwind", rev = "eaa813e1c26819251060a0ac7af0b75fe871bcea" }
rushwind-http-binding = { git = "https://github.com/tx7do/rushwind", rev = "eaa813e1c26819251060a0ac7af0b75fe871bcea" }
axum = { version = "0.8", default-features = false, features = ["matched-path"] }
base64 = "0.22"
serde_json = { workspace = true }
