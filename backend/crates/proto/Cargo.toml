[package]
name = "proto"
description = "The CMS API contract crate: the synced api/protos tree compiled to prost types with pbjson protojson serde, the buf-produced annotated descriptor pool, and the rushwind-gen-http-generated route/binding/trait/mount surface (the deployments' auth-free union rides here as AUTH_FREE)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
prost = { workspace = true }
prost-reflect = { workspace = true }
pbjson = { workspace = true }
pbjson-types = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
axum = { version = "0.8", default-features = false }
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel", "server", "transport"] }
tonic-prost = "0.14"
rushwind-http-binding = { git = "https://github.com/tx7do/rushwind", rev = "9bad36d8c14332da3e3dc2795b5e40e12ab621de" }
rushwind-redact = { git = "https://github.com/tx7do/rushwind", rev = "9bad36d8c14332da3e3dc2795b5e40e12ab621de" }
rushwind-storage-seaorm-support = { git = "https://github.com/tx7do/rushwind", rev = "9bad36d8c14332da3e3dc2795b5e40e12ab621de" }

[build-dependencies]
rushwind-proto-build = { git = "https://github.com/tx7do/rushwind", rev = "9bad36d8c14332da3e3dc2795b5e40e12ab621de", features = ["tonic"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
